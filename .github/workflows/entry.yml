---
name: Monocle CI

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  actions: read
  checks: write
  contents: read
  issues: read
  packages: read
  pull-requests: write
  statuses: read
  security-events: write

jobs:
  monocle:
    name: Monocle
    uses: ./.github/workflows/build.yml
    with:
      os: ubuntu-24.04
      jdk: 25.0.2
      openjfx: 26
    secrets: inherit
